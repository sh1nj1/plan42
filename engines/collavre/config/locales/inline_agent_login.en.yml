en:
  collavre:
    inline_agent_login:
      required: Sign in to %{engine} to continue.
      help: Sign in here. Your original request will resume once login completes.
      partial: Sign in here, then send a new message to continue. This turn already
        started and will not be replayed automatically.
      owner_required: The agent owner or a system administrator needs to sign in to
        this shared connection.
      requester_required: The person who started this request needs to sign in to
        their connection.
      resumed: Login complete. The original request has been queued again.
      replay_abandoned: The original request could not be resumed because its message
        or access changed. Check your connection and permissions, then send a new message.
      expired: Login expired. Start a new login.
      errors:
        already_resumed: The original request is already queued. Its login session can no longer be changed.
        session_superseded: This login was replaced. Start a new login.
        not_authorized: Complete login before retrying.
        cannot_retry: This turn cannot be retried yet. Refresh and try again.
