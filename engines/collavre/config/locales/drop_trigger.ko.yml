ko:
  collavre:
    drop_trigger:
      child_entered: "🔔 드롭 트리거 — 크리에이티브 '%{child_description}' (ID: %{child_id})가 '%{parent_description}'에 추가되었습니다. 이 단계의 목적에 맞게 처리해주세요."
      no_agent: "⚠️ 드롭 트리거 실패 — '%{parent_description}'에 쓰기 권한을 가진 AI 에이전트가 없습니다. 자동 처리를 위해 AI 에이전트에 쓰기 권한을 부여해주세요."

      not_a_container: "부모가 트리거 컨테이너가 아닙니다"
      toggle_on: "드롭 트리거 활성화됨"
      toggle_off: "드롭 트리거 비활성화됨"
    trigger_loop:
      instructions: |
        ---
        [LOOP INSTRUCTIONS]
        이것은 루프 트리거입니다. 각 응답의 마지막에 상태를 보고해주세요:
        - [STATUS: DONE] — 모든 작업을 실제로 실행하고 검증 완료. 실행하지 않은 작업이 남아있으면 (예: 크리에이티브 이동, PR 생성, 레코드 업데이트 등) 절대 DONE을 보고하지 마세요. 응답에 남은 작업을 설명했다면 완료가 아닙니다 — CONTINUE를 사용하세요.
        - [STATUS: CONTINUE] — 진행 중이지만 아직 실행해야 할 작업이 남아있음
        - [STATUS: BLOCKED 사유] — 도움 없이 진행 불가
      continue: "🔄 트리거 루프 — 반복 %{iteration}/%{max}. 이전 작업이 미완료입니다. 이어서 진행하고 [STATUS: DONE/CONTINUE/BLOCKED]으로 보고해주세요."
      retry: "🔄 트리거 루프 — 반복 %{iteration}/%{max}. 이전 시도가 인프라 에러(타임아웃/연결 실패)로 실패했습니다. 처음부터 다시 시도하고 [STATUS: DONE/CONTINUE/BLOCKED]으로 보고해주세요."
      stuck: "⚠️ 트리거 루프 일시정지 — 에이전트가 반복 %{iteration}에서 BLOCKED를 보고했습니다. 사용자 개입이 필요할 수 있습니다."
      max_reached: "⚠️ 트리거 루프 중단 — 최대 반복 횟수(%{max})에 도달했습니다. 진행 상황을 확인하고 필요시 재시작해주세요."
      infra_stuck: "⚠️ 트리거 루프 일시정지 — 연속 %{count}회 인프라 에러(타임아웃/연결 실패) 발생. 서비스가 불안정할 수 있습니다. 사용자 개입이 필요합니다."
      verification_failed: "🔍 트리거 루프 — 반복 %{iteration}/%{max}. [STATUS: DONE] 검증에 실패했습니다. 다음 작업이 완료되지 않았습니다:\n%{reason}\n\n남은 작업을 모두 완료한 후 [STATUS: DONE/CONTINUE/BLOCKED]으로 보고해주세요."
      start: "시작"
      pause: "일시정지"
      resume: "재개"
      restart: "재시작"
      state_idle: "대기 중"
      state_running: "실행 중"
      state_pending_verification: "검증 중"
      state_completed: "완료"
      state_stuck: "중단됨"
      state_max_reached: "최대 반복 도달"
      state_paused: "일시정지됨"
