ko:
  collavre:
    landing:
      meta:
        title: "팀이 함께 생각하는 곳"
        description: "계층형 크리에이티브, AI 에이전트, 실시간 채팅이 하나로. 체계적으로 정리하고, 협업하고, AI와 함께 완성하세요."
      hero:
        title_html: "사람의 생각을 잇고,<br><em>AI</em>가 함께 만드는 워크스페이스"
        subtitle: "흩어진 아이디어, 끊어진 맥락, 잊혀진 결정 — Collavre는 팀의 지식을 살아있는 구조로 만들어 함께 완성해 갑니다."
        tagline: "COLLABORATIVE INTELLIGENCE"
        cta: "무료로 시작하기"
        watch_demo: "데모 보기"
      demo:
        placeholder: "실제 작동 화면이 들어갈 자리입니다"
      why:
        title: "누구를 위한 도구인가요?"
        subtitle: "일을 정리해야 하고, 함께 만들어야 하고, 놓치지 말아야 하는 모든 팀을 위해."
        context:
          title: "맥락이 끊기지 않는 협업"
          desc: "회의에서 나온 결정, 채팅에서 나온 아이디어, 문서에 묻힌 합의 — 한 곳에서 이어집니다. 더 이상 '그때 뭐였지?' 하지 않아도 됩니다."
        human:
          title: "사람이 중심인 도구"
          desc: "AI는 강력하지만, 결국 일을 만드는 건 사람입니다. Collavre는 사람의 판단을 AI가 돕도록 설계되었습니다."
        grow:
          title: "함께 자라는 문서"
          desc: "한번 쓰고 잊혀지는 문서가 아니라, 팀과 함께 성장하는 살아있는 지식 체계입니다."
      problem:
        title: "기존 도구의 한계"
        notion:
          title: "Notion"
          desc: "문서는 무덤이 됩니다. 남의 페이지를 고치기 꺼려하고, 검색이 구조를 대체합니다."
        jira:
          title: "Jira"
          desc: "작업 관리는 좋지만 지식 관리는 안 됩니다. 결과물이 위키로 돌아오지 않습니다."
        slack:
          title: "Slack"
          desc: "대화가 흘러가 버립니다. 채널은 폭발적으로 늘어나고, 맥락은 매일 사라집니다."
      features:
        title: "하나의 살아있는 트리로"
        subtitle: "크리에이티브는 작업을 정리하고, 진행률을 추적하며, 맥락을 전달하는 계층형 블록입니다."
        tree:
          title: "계층형 크리에이티브"
          desc: "작업을 트리로 구성하세요. 드래그, 링크, 재사용이 자유롭고 진행률은 자동 계산됩니다."
        ai:
          title: "AI 에이전트 팀원"
          desc: "AI 에이전트를 대화에 추가하세요. 리뷰, 협업, @멘션 응답 — 동료처럼 일합니다."
        context:
          title: "컨텍스트 시스템"
          desc: "워크스페이스 전체에 지식을 연결하세요. 하위 크리에이티브가 맥락을 자동으로 상속합니다."
        chat:
          title: "실시간 채팅 & 토픽"
          desc: "모든 크리에이티브에 채팅이 있습니다. 토픽으로 대화를 정리하고, 메시지를 다른 크리에이티브로 옮기세요."
        integrations:
          title: "외부 연동"
          desc: "GitHub PR 자동 분석, Slack 동기화, Google Calendar 연동, MCP 도구 내장."
        progress:
          title: "실시간 진행률"
          desc: "리프부터 루트까지 완료율 추적. 태그, 계획, 상태별 필터. 프로젝트 건강도를 한눈에."
      how:
        title: "이렇게 사용하세요"
        step1:
          title: "작업을 구조화"
          desc: "크리에이티브를 트리로 만드세요. 마크다운, PPT에서 가져오거나 직접 구성하세요."
        step2:
          title: "함께 작업"
          desc: "채팅, 공유, 태그, 계획. AI 에이전트를 추가해 리뷰와 분석을 자동화하세요."
        step3:
          title: "확신을 갖고 완성"
          desc: "진행률을 실시간으로 추적하세요. AI가 맥락을 유지하니 놓치는 것이 없습니다."
      cta:
        title: "더 똑똑하게 협업할 준비 되셨나요?"
        subtitle: "팀의 생각을 이어주는 워크스페이스, 지금 시작하세요."
      footer:
        rights: "모든 권리 보유."
