ko:
  collavre:
    landing:
      meta:
        title: "문서, 일감, 대화, 그리고 AI 컨텍스트를 하나의 살아있는 트리로"
        description: "Collavre는 하나의 블록이 문서이자 일감이자 대화이자 AI 에이전트의 컨텍스트인 셀프호스팅 워크스페이스입니다. 에이전트가 골라내야 할 사본 세 벌이 아니라, 하나의 객체입니다. 루트에 규칙을 한 번 꽂아두면 그 아래 모든 일감이 상속받습니다 — 사람에게도, 에이전트에게도."
      hero:
        eyebrow: "사람과 AI 에이전트를 위한 워크스페이스"
        headline_html: "하나의 살아있는 트리로"
        subline: "하나의 블록이 문서이자 일감이자 대화이자 에이전트의 컨텍스트입니다. 에이전트가 골라내야 할 사본 세 벌이 아니라, 하나의 객체입니다."
        tagline: "루트에 규칙을 한 번만 꽂아두세요. 그 아래 모든 일감이 상속받습니다 — 사람에게도, 에이전트에게도."
        learn_more: "어떻게 동작하나요"
      demo:
        title: "복사는 한 번도 일어나지 않습니다"
        subtitle: "마크다운 스펙이 그대로 일감 트리가 됩니다. 팀이 그 위에서 일하고, 에이전트는 컨텍스트를 이미 지닌 채 합류하며, 진행률은 루트까지 저절로 집계됩니다. 90초, 재입력 0회."
        video: "/public-assets/blobs/eyJfcmFpbHMiOnsiZGF0YSI6NDcwLCJwdXIiOiJibG9iX2lkIn19--d2e47d9773e9179a4f6a2a69f5740f3551c69e08/launch-ko.mp4"
        poster: "/public-assets/blobs/eyJfcmFpbHMiOnsiZGF0YSI6NDcxLCJwdXIiOiJibG9iX2lkIn19--9d63bb60ec693416eddd73ea3ff3532bc09ed71e/launch-ko-poster.jpg"
        video_dark: "/public-assets/blobs/eyJfcmFpbHMiOnsiZGF0YSI6NDcyLCJwdXIiOiJibG9iX2lkIn19--6d635234d2070b43f16c404a9e81e7642062c172/launch-ko-dark.mp4"
        poster_dark: "/public-assets/blobs/eyJfcmFpbHMiOnsiZGF0YSI6NDczLCJwdXIiOiJibG9iX2lkIn19--094d1e6e8691ea987effeca29195e5fc313bff33/launch-ko-dark-poster.jpg"
      problem:
        title: "같은 내용을 세 번 씁니다"
        notion:
          title: "문서"
          desc: "스펙을 씁니다. 아무도 고치지 않는 무덤이 되고, 구조는 조용히 검색으로 대체됩니다."
        jira:
          title: "트래커"
          desc: "스펙을 티켓으로 다시 옮겨 적습니다. 그 티켓이 어느 문단에서 나왔는지는 어디에도 기록되지 않습니다."
        slack:
          title: "대화"
          desc: "세 번째로 채팅에서 다시 설명합니다. 결정은 아무 데도 붙어 있지 않은 채 스크롤 너머로 사라집니다."
        ai:
          title: "그리고 에이전트"
          desc: "이제 아무도 붙여넣지 않습니다. MCP로 연결해 세 벌을 다 읽죠. 그래도 어느 사본이 진짜인지, 이 일의 경계가 어디까지인지는 여전히 추측해야 합니다."
      features:
        title: "사본 세 벌이 아니라, 하나의 객체"
        subtitle: "하나의 블록이 동시에 문서이고 일감이고 대화이고 에이전트 컨텍스트의 단위입니다. 블록은 트리로 중첩되고, 그 트리가 곧 스코프입니다."
        tree:
          title: "마크다운을 넣으면 일감 트리가 나옵니다"
          desc: "스펙을 임포트하면 헤딩 깊이가 그대로 트리 깊이가 됩니다. 재입력은 없습니다. 진행률은 리프에서 루트까지 알아서 집계됩니다."
        context:
          title: "컨텍스트는 렉시컬 스코프를 따릅니다"
          desc: "코딩 규칙이든 디자인 문서든 어떤 노드에나 꽂아두세요. 모든 자손이 상속받습니다. 세 단계 아래 일감에서 에이전트를 불러도 이미 알고 옵니다."
        ai:
          title: "에이전트는 옆 창의 챗봇이 아니라 팀원입니다"
          desc: "어느 대화에서든 에이전트를 @멘션하세요. 해당 블록의 서브트리와 상속된 컨텍스트를 지닌 채 답하고, 나머지 트리는 MCP로 직접 탐색합니다."
        chat:
          title: "모든 블록에 대화가 붙습니다"
          desc: "논의는 그 논의가 다루는 일에 붙어 있습니다. 버그를 찾으면 그 블록에 토픽을 추가하고, 끝나면 아카이브합니다. 따로 연결할 것이 없습니다."
        integrations:
          title: "외부 연동"
          desc: "GitHub, Linear, Slack, Notion과 양방향 동기화. MCP 서버와 OpenAI 호환 API가 기본 내장되어 있습니다."
        progress:
          title: "실시간 진행률"
          desc: "리프부터 루트까지 완료율 추적. 태그, 계획, 상태별 필터. 프로젝트 건강도를 한눈에."
      cta:
        title: "사본 세 벌을 맞추는 일은 그만"
        subtitle: "셀프호스팅. AGPL 오픈소스. MCP 네이티브."
        start: "시작하기"
      footer:
        rights: "모든 권리 보유."
