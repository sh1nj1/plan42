ko:
  collavre:
    tool_descriptions:
      keep:
        summary: 토픽에서 반복 횟수가 제한된 keep 루프를 시작합니다.
        details: |-
          쓰기 권한이 필요하며 /keep과 동일한 검증 및 라우팅을 사용합니다. topic_id를 지정하면 creative_id는 해당 토픽에서 결정됩니다.
          max는 1~1000회로 설정하며 기본값은 10회입니다. agent_name에는 @와 콜론 없이 정확한 에이전트 이름을 지정할 수 있으며, 생략하면 기본 토픽 라우팅을 사용합니다.
          goal에 목표를 지정하거나 생략하여 토픽의 현재 작업을 이어갑니다.
      meta_tool:
        summary: 등록된 도구를 하나의 인터페이스로 조회하고 실행합니다.
        details: 도구를 이름으로 목록 조회, 검색, 설명, 실행합니다. 에이전트는 이 도구로 사용자 정의 Ruby 도구를 찾고, 소유자가 승인한 뒤 실행합니다.
      approval_request:
        summary: 에이전트 작업을 멈추고 사람에게 승인 또는 거절을 요청합니다.
        details: |-
          에이전트가 구체적인 질문을 보내며, 승인자는 기본적으로 작업을 시작한 메시지의 작성자입니다.
          에이전트는 승인/거절 결과, 사유, 결정한 사람을 전달받습니다. 거절도 정상적인 결과이며 에이전트는 계획을 다시 검토해야 합니다.
          요청은 자동으로 만료되지 않습니다.
      creative_attach_files_service:
        summary: 에이전트가 작성한 텍스트(Markdown, HTML, SVG)를 크리에이티브에 첨부합니다.
        details: |-
          내용은 파일로 저장되어 크리에이티브에 삽입되고, 크리에이티브를 읽을 수 있는 사람만 열 수 있는 다운로드 URL이 반환됩니다.
          디스크에 있는 바이너리 파일(PNG, MP4, PDF)은 CLI의 `collavre attach`로 업로드합니다.
          쓰기 권한이 필요합니다. 리뷰 정책이 적용되면 승인용 초안이 History에 저장됩니다.
      creative_batch_service:
        summary: 여러 크리에이티브의 생성·수정·삭제를 한 번에 실행합니다.
        details: |-
          모든 작업은 하나의 트랜잭션으로 실행되어, 하나라도 실패하면 아무것도 적용되지 않습니다.
          삭제는 크리에이티브를 보관 처리하므로 History에서 복구할 수 있습니다.
          리뷰 정책이 적용되면 승인용 초안이 History에 저장됩니다.
      creative_create_service:
        summary: 상위 크리에이티브 아래에, 또는 상위를 지정하지 않으면 최상위에 새 크리에이티브(작업 또는 콘텐츠 블록)를 만듭니다.
        details: |-
          크리에이티브는 트리 구조이며, 상위 항목의 진행률은 하위 항목으로부터 계산됩니다.
          대화의 크리에이티브 트리로 범위가 제한된 에이전트는 항상 상위 항목을 지정해야 합니다.
          설명은 Markdown으로 작성합니다.
          ToolMeta DSL을 쓴 Ruby 코드 블록을 넣으면 새 도구가 정의되며, 소유자 승인 후 사용할 수 있습니다.
          리뷰 정책이 적용되면 승인용 초안이 History에 저장됩니다.
      creative_import_service:
        summary: Markdown 문서를 크리에이티브 트리로 가져옵니다.
        details: |-
          제목은 중첩된 크리에이티브가 되고, 글머리 목록은 들여쓰기에 따라 하위 항목이 됩니다.
          표, 코드 블록, 인라인 이미지도 지원합니다.
          리뷰 정책이 적용되면 승인용 초안이 History에 저장됩니다.
      creative_link_service:
        summary: 기존 크리에이티브를 상위 크리에이티브 아래에 링크합니다.
        details: |-
          새 링크는 입력 순서대로 뒤에 추가되고, 같은 원본에 대한 기존 링크는 그대로 재사용됩니다.
          원본에 읽기 권한, 대상에 쓰기 권한이 필요합니다. 리뷰 정책이 적용되면 승인용 초안이 저장됩니다.
      creative_list_attachments_service:
        summary: 크리에이티브의 첨부 파일과 다운로드 URL을 조회합니다.
        details: 각 첨부 파일의 파일명, 형식, 크기와 크리에이티브를 읽을 수 있는 사람만 열 수 있는 URL을 반환합니다. 읽기 권한이 필요합니다.
      creative_remove_attachment_service:
        summary: 크리에이티브에서 첨부 파일 하나를 제거합니다.
        details: |-
          설명에서 첨부 파일을 제거하고, 다른 곳에서 쓰지 않으면 파일도 삭제합니다.
          쓰기 권한이 필요합니다. 리뷰 정책이 적용되면 승인용 초안이 History에 저장됩니다.
      creative_reorder_service:
        summary: 크리에이티브의 직속 하위 항목 순서를 바꿉니다.
        details: |-
          모든 직속 하위 항목 ID를 새 순서대로 한 번씩 전달해야 합니다. 누락·추가·중복된 ID가 있으면 거부되고 아무것도 바뀌지 않습니다.
          상위 항목과 모든 하위 항목에 쓰기 권한이 필요합니다. 링크된 크리에이티브는 원본의 하위 항목 순서가 바뀝니다.
          리뷰 정책이 적용되면 승인용 초안이 History에 저장됩니다.
      creative_retrieval_service:
        summary: ID나 검색어로 크리에이티브를 찾습니다.
        details: |-
          ID나 검색어가 없으면 최상위 크리에이티브를 반환합니다.
          결과는 ID, 제목, 진행률로 된 간결한 Markdown 트리입니다. level을 높이면 더 깊이 읽을 수 있습니다.
      creative_unlink_service:
        summary: 링크된 크리에이티브를 제거하고 원본은 유지합니다.
        details: |-
          링크된 크리에이티브만 제거할 수 있으며 일반 크리에이티브 ID는 거부됩니다.
          모든 제거는 함께 성공하거나 함께 실패합니다. 리뷰 정책이 적용되면 승인용 초안이 저장됩니다.
      creative_update_service:
        summary: 크리에이티브의 내용을 수정하거나, 완료 처리하거나, 이동합니다.
        details: |-
          크리에이티브 설명을 바꾸거나, 말단 크리에이티브를 100% 완료로 표시하거나, 다른 상위 항목으로 옮깁니다.
          완료 처리는 말단 크리에이티브만, 100%로만 가능하며 상위 항목의 진행률은 하위 항목으로부터 계산됩니다.
          Ruby 도구의 코드를 수정하면 소유자 승인을 다시 받아야 합니다.
          리뷰 정책이 적용되면 승인용 초안이 History에 저장됩니다.
      cron_cancel:
        summary: 예약 작업을 취소합니다.
        details: 키로 작업을 삭제합니다. 작업이 속한 크리에이티브에 쓰기 권한이 필요합니다.
      cron_create:
        summary: cron 일정에 따라 토픽에 메시지를 게시하는 작업을 예약합니다.
        details: |-
          크리에이티브의 토픽에 메시지를 게시하고(토픽이 없으면 생성) 에이전트를 실행합니다.
          기본적으로 반복 실행되며, once를 설정하면 처음 한 번만 실행됩니다.
          일정은 cron 문법을 씁니다. 예: '*/5 * * * *'는 5분마다, '0 9 * * *'는 매일 오전 9시.
      cron_list:
        summary: 예약 작업 목록을 조회합니다.
        details: 읽을 수 있는 크리에이티브의 작업을 보여줍니다. 크리에이티브 ID를 지정하면 해당 작업만 조회합니다.
      cron_update:
        summary: 예약 작업의 일정, 메시지, 설명을 변경합니다.
        details: 작업이 속한 크리에이티브에 쓰기 권한이 필요합니다.
      preview_attach:
        summary: 개발 프리뷰 서버 링크를 토픽에 표시합니다.
        details: |-
          토픽에 프리뷰 URL과 실행/중지 상태 배지가 있는 칩을 추가합니다.
          프리뷰 서버를 시작한 뒤 호출합니다. 같은 워크트리로 다시 호출해도 중복되지 않습니다.
      preview_detach:
        summary: 개발 프리뷰를 중지 상태로 표시합니다.
        details: 칩은 누군가 닫을 때까지 중지 배지와 함께 남아 있습니다. 이미 중지되었거나 없는 프리뷰에 호출하면 아무 일도 일어나지 않습니다.
      collavre_source_list:
        summary: Collavre 소스 디렉터리와 파일을 탐색합니다.
        details: 경로가 없으면 읽을 수 있는 최상위 경로(앱 코드, 엔진, 로케일, 라우트)를 보여줍니다. 디렉터리 경로를 지정하면 그 안의 항목을 보여줍니다.
      collavre_source_read:
        summary: Collavre 소스 파일을 줄 번호와 함께 읽습니다.
        details: 한 번에 최대 400줄을 반환하며, start_line과 end_line으로 이어서 읽습니다.
      collavre_source_search:
        summary: Collavre 소스 코드에서 텍스트를 검색합니다.
        details: 대소문자 구분 없이 문자 그대로 검색하여 파일 경로, 줄 번호, 일치하는 줄을 반환합니다. 디렉터리나 파일을 지정해 범위를 좁힐 수 있습니다.
      task_status:
        summary: 지시 메시지나 작업 ID로 작업 상태를 확인합니다.
        details: |-
          위임되거나 대체된 작업을 포함해 종합 상태와 열람 가능한 답변 미리보기를 반환합니다. 읽기 권한이 필요합니다.
          메시지 게시 직후에는 작업이 아직 없을 수 있습니다. 에이전트의 턴이 끝나도 요청한 일이 완료된 것은 아닐 수 있으므로 답변도 확인하세요.
      topic_tasks:
        summary: 토픽의 작업 목록과 현재 상태를 조회합니다.
        details: |-
          진행 중, 종료, 전체 작업으로 필터링하고 반환 개수를 제한할 수 있습니다. 토픽 읽기 권한이 필요합니다.
          작업 추적에 필요한 작업 ID, 에이전트, 지시 메시지 ID, 시각, 열람 가능한 답변 미리보기를 반환합니다.
      topic_branch:
        summary: 선택한 메시지의 사본으로 새 토픽을 시작합니다.
        details: |-
          원본 메시지는 기존 토픽에 그대로 남습니다. 너무 길어진 대화를 새로 시작하거나 두 주제로 갈라진 대화를 나눌 때 씁니다.
          한 번에 최대 100개 메시지까지 복사할 수 있으며, 승인 요청은 복사할 수 없습니다.
          메시지를 복사하지 않고 옮기려면 topic_create를 씁니다. 피드백 권한 이상이 필요합니다.
      topic_create:
        summary: 크리에이티브에 토픽(대화 스레드)을 만듭니다.
        details: |-
          서로 다른 토픽의 작업은 병렬로 실행되고, 같은 토픽의 작업은 차례를 기다립니다. 독립적인 작업마다 토픽을 하나씩 만드세요.
          Primary Agent는 독점적으로 지정되어 해당 에이전트만 토픽에서 응답합니다. 에이전트에게 피드백 권한 이상이 필요합니다.
          메시지 ID를 전달하면 해당 메시지가 새 토픽으로 옮겨집니다. 쓰기 권한이 필요합니다.
      topic_list:
        summary: 크리에이티브의 토픽 목록을 보거나, ID로 토픽 정보를 조회합니다.
        details: |-
          토픽별 이름, 보관 상태, Primary Agent, 메시지 수와 분량을 반환하므로 읽을 양을 가늠할 수 있습니다.
          읽기 권한이 필요합니다. 알 수 없거나 읽을 수 없는 ID는 호출을 실패시키지 않고 오류로 표시됩니다.
      topic_message_create:
        summary: 기존 토픽에 메시지를 게시합니다.
        details: |-
          주로 topic_create 다음에 토픽의 Primary Agent에게 첫 지시를 전달할 때 씁니다. 서로 다른 토픽의 메시지는 병렬로 실행될 수 있습니다.
          호출한 사람이 작성자로 남습니다. 에이전트는 현재 처리 중인 토픽에는 게시할 수 없습니다.
          피드백 권한 이상이 필요합니다. 보관된 토픽, History, System 토픽에는 게시할 수 없습니다.
      topic_messages:
        summary: 하나 이상의 토픽에서 메시지를 페이지 단위로 읽습니다.
        details: |-
          최신 메시지부터 가져오며 기본적으로 오래된 순으로 표시합니다. 여러 토픽을 한 번에 읽을 수 있고 토픽마다 따로 페이지가 나뉩니다.
          응답은 글자 수 한도가 있으며, 잘린 토픽은 이어 읽을 위치를 알려줍니다.
          볼 수 없는 비공개 메시지와 승인 요청은 항상 제외됩니다. 읽기 권한이 필요합니다.
      topic_move:
        summary: 토픽과 모든 메시지를 다른 크리에이티브로 옮깁니다.
        details: |-
          토픽 ID, 메시지, 보관 상태는 유지됩니다. Primary Agent는 대상에서도 응답할 수 있으면 그대로 지정됩니다.
          권한은 함께 옮겨지지 않으므로 원본을 읽을 수 있던 사람이 접근하지 못할 수 있습니다.
          현재 크리에이티브에 관리자 권한, 대상에 쓰기 권한이 필요합니다. Main, System, 실행 중인 세션 토픽은 옮길 수 없습니다.
      topic_update:
        summary: 토픽 이름 변경, 보관, Primary Agent 변경을 합니다.
        details: |-
          대화가 끝난 토픽은 보관하세요. 사이드바에서 사라지지만 모든 메시지는 남습니다.
          Primary Agent는 독점적으로 지정되며 "none"을 전달하면 해제됩니다.
          이름 변경은 관리자 권한, 보관과 Primary Agent 변경은 쓰기 권한이 필요합니다. Main과 System 토픽은 이름을 바꾸거나 보관할 수 없습니다.
