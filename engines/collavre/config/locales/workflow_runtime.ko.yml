ko:
  collavre:
    workflow:
      runtime:
        title: "처리가 필요합니다"
        action_needed: "워크플로에서 확인이 필요합니다. 대화를 열어 주세요."
        help_title: "워크플로 실행과 제한"
        completion: "on 모드에서 agent 규칙은 예약된 모든 에이전트가 사용 가능한 공개 응답을 완료하면 이벤트를 한 번 발행합니다. human은 대상 크리에이티브 소유자에게 처리를 넘기고 멈추며, none은 무시합니다. human과 none은 emits를 설정해도 발행하지 않습니다. 로그인 카드와 응답 없는 리뷰 수정은 발행 없이 종료하며, 로그인 후에는 새 메시지가 필요합니다. off와 shadow에서는 실행하지 않으며, 규칙 저장도 실행을 시작하지 않습니다."
        bounds: "토픽별 체인은 상대 깊이 8, 절대 깊이 64, 에이전트 태스크 16개, 규칙 실행 16개로 제한합니다. 같은 규칙은 체인에서 한 번만 실행합니다. 인프라 재시도는 3회이며 이벤트 식별자와 생성 시각을 보존합니다. 일반 멘션과 기본 라우팅은 기존 제한을 따릅니다. 독립 cron 실행, 새 트리거 job, 명시적 재시작은 각각 별도 알림을 만들 수 있습니다."
        delivery: "소유자의 Inbox 알림은 유지됩니다. 워크플로 푸시는 알림 설정 미지정과 켜짐을 허용하고, 명시적인 꺼짐만 차단합니다. 푸시는 최대 3회이며 매회 큐 대기 30분, 전송 5분을 허용합니다. worker 소실이나 큐 등록 전 크래시는 30분 만료 후에도 sweep과 복구 큐 지연이 더해집니다. 매번 큐 대기가 30분을 넘으면 실제 전송 없이 실패할 수 있습니다. 이는 전달·복구 SLA가 아닌 최선 노력 제한이며 외부 푸시는 중복될 수 있습니다."
        moves: "토픽 이동은 대기 중인 워크플로를 중단하고 남은 푸시를 억제할 수 있으며, 체인을 목적지로 옮기지 않습니다. 권한 복구, 라우팅 재활성화, 원래 위치로의 이동도 종료된 실행을 다시 열지 않습니다. 새 메시지는 새 루트를 시작합니다."
        non_emitting: "이 처리자는 이벤트를 발행하지 않으므로 설정한 emits 값은 실행되지 않습니다."
      editor:
        non_emitting: "이 처리자는 이벤트를 발행하지 않으므로 설정한 emits 값은 실행되지 않습니다."
        events:
          workflow_step_completed: "워크플로 단계 완료"
        source_labels:
          workflow: "워크플로"
