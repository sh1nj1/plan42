ko:
  collavre:
    screening:
      approval_request: |-
        프롬프트 인젝션 검사로 %{agent}에게 전달할 메시지를 확인하지 못했습니다 (%{error}).
        승인하면 검사 없이 %{agent}에게 전달하고, 거절하면 전달하지 않습니다.

        보낸 사람: %{sender}

        %{excerpt}
      flagged_approval_request: |-
        프롬프트 인젝션 검사에서 %{agent}에게 전달할 메시지를 주의로 판정했습니다.
        승인하면 %{agent}에게 전달되고, 거절하면 전달되지 않습니다.

        발신자: %{sender}

        %{excerpt}
      also_flagged: "다른 검사기도 이 메시지를 주의로 판정했습니다."
      blocked_notice: "프롬프트 인젝션 검사에서 위험한 내용으로 판정되어 이 메시지를 %{agent}에게 전달하지 않았습니다."
      unscreened_notice: "프롬프트 인젝션 검사로 확인하지 못해 이 메시지를 %{agent}에게 전달하지 않았습니다."
      denied_notice: "에이전트 소유자가 거절하여 %{agent}에게 메시지를 전달하지 않았습니다."
      unknown_sender: "확인되지 않은 발신자"
