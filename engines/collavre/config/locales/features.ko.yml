            - heading: "컨텍스트는 상속됩니다"
              body: "Creative는 상위 Creative에 연결된 컨텍스트를 물려받습니다. 팀의 작업 규칙을 트리 상단에 한 번만 연결해두면 그 아래 모든 채팅이 이미 그 규칙을 알고 있으므로, 같은 설명을 스레드마다 다시 붙여넣지 않아도 됩니다."
            - heading: "메시지 안에서 연결하기"
              body: "/creative 명령어는 메시지 자체에 다른 Creative 링크를 삽입합니다. AI 채팅에서는 그 Creative와 같은 설정 깊이까지의 하위 항목이 해당 대화의 컨텍스트로 주입되므로, 상시로 붙여두고 싶지 않은 일회성 참조에 적합합니다."
          tips:
            - "컨텍스트는 에이전트가 읽는 범위이지 변경할 수 있는 범위가 아닙니다. 쓰기 권한은 공유로 따로 정해집니다."
            - "각 에이전트에는 하위 깊이 한도가 설정됩니다. 기본값은 하위 6단계이며, 0이면 참조한 Creative만 포함됩니다. 그보다 깊은 하위 항목은 에이전트에게 전달되지 않습니다."
            - "질문에 답하기에 충분한 가장 좁은 Creative를 연결하세요. 큰 트리는 에이전트가 실제 요청에 쓸 주의력을 가져갑니다."
        automation_trigger:
          title: "자동화 트리거"
