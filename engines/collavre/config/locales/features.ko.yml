              body: "메시지를 @이름: 으로 시작하세요. 멘션할 수 있는 사람이나 AI 에이전트의 이름 뒤에 콜론을 붙이면, 그 뒤의 내용이 그 대상에게 전달되는 메시지가 됩니다. 멘션은 메시지 맨 앞이나 공백 뒤에 와야 인식되므로, 문장 중간의 이메일 주소나 코드 조각이 멘션으로 잘못 읽히지 않습니다."
            - heading: "사람과 에이전트는 같은 방식으로 동작합니다"
