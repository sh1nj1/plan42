              body: "메시지 맨 앞에 /를 입력하면 사용 가능한 명령어 메뉴가 나타납니다. 명령어를 고르면 인자를 입력받는 작은 폼이 열리므로 인자 순서를 외울 필요가 없습니다. 명령어는 메시지처럼 전송되고, 실행 결과가 스레드에 남습니다."
            - heading: "기본 제공 명령어"
              body: "/calendar(또는 /cal)는 날짜와 메모로 로컬 캘린더 일정을 만들며 tomorrow, +3days, +mon 같은 상대 날짜를 인식합니다. Google Calendar가 연결되어 있으면 Collavre가 해당 일정의 동기화도 시도합니다. /topic은 새 토픽을 만들고 주 담당 에이전트를 지정할 수 있습니다. /work는 하위 Creative를 깊이 우선으로 순회하며 에이전트가 각각에 작업을 수행하게 합니다. /compress는 현재 토픽의 메시지를 요약하고 원본을 정리합니다. /creative는 다른 Creative 링크를 삽입하며, AI 채팅에서는 그 Creative와 에이전트에 설정된 하위 깊이 한도까지의 하위 항목이 컨텍스트로 함께 주입됩니다."
            - heading: "MCP 도구"
              body: "워크스페이스에 등록된 MCP 도구는 기본 명령어 아래 같은 메뉴에 나타나며 동일한 명령 폼으로 실행됩니다. 표시되는 도구는 등록 여부와 사용 권한에 따라 달라집니다."
          tips:
            - "입력 중이던 내용은 그대로 유지됩니다. 명령어는 작성 중인 문장을 덮어쓰지 않고 앞에 붙습니다."
            - "/compress에는 토픽, 쓰기 권한, 사용 가능한 AI 에이전트가 필요합니다. Collavre는 토픽의 주 담당 에이전트, 정책의 주 담당 에이전트, 해당 Creative에 댓글 권한으로 공유된 AI 에이전트 순으로 찾습니다."
            - "명령어는 메시지로 전송되므로 댓글 권한이 필요하고, 보관된 Creative에서는 사용할 수 없습니다."
        chat_context:
          title: "채팅 컨텍스트"
