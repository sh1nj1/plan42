      pages:
        mention_agent:
          title: "팀원 · 에이전트 멘션"
          tagline: "한 명을 직접 지목하면, 그 한 명만 답합니다."
          meta_description: "Collavre 채팅에서 @이름: 으로 팀원이나 AI 에이전트를 지목해 메시지를 보내는 방법."
          sections:
            - heading: "사용 방법"
              body: "@이름: 형식으로 멘션할 수 있는 사람이나 AI 에이전트의 이름 뒤에 콜론을 붙이면, 그 뒤의 내용이 그 대상에게 전달됩니다. 이 표준 형식의 @는 메시지 맨 앞, 공백 뒤, 또는 : . , ; 중 하나 뒤에 올 수 있습니다. 메시지 맨 앞에서는 @이름 뒤에 공백만 두어도 콜론 없는 멘션으로 인식되므로, @Agent 작업해라고 쓰면 해당 메시지가 Agent라는 AI 에이전트에게 라우팅됩니다. 이 콜론 없는 형식은 AI 라우팅에만 사용됩니다. 팀원에게 멘션 알림을 보내려면 @이름: 표준 형식을 사용하세요. 이메일 주소처럼 단어 중간에 있는 다른 @ 기호는 멘션이 아닙니다."
            - heading: "멘션 후 동작"
              body: "@이름: 표준 형식으로 지목한 팀원에게는 멘션 알림이 갑니다. 댓글 권한이 있는 AI 에이전트는 멘션되면 채팅과 해당 Creative, 그리고 연결된 컨텍스트를 읽고 스레드에 답변합니다. 메시지 맨 앞의 콜론 없는 형식도 AI 에이전트를 라우팅하지만 팀원 멘션 알림은 만들지 않습니다."
            - heading: "멘션할 수 있는 대상"
              body: "멘션 목록에는 Creative 소유자, 댓글 이상의 권한을 공유받은 사용자, 전역 검색 가능한 사용자와 에이전트가 표시됩니다. 읽기 전용 참여자는 전역 검색 대상이 아니면 멘션할 수 없습니다. 전역 검색 가능한 AI 에이전트는 Creative 접근 권한이 없어도 표시될 수 있지만, 댓글 이상의 권한으로 Creative를 공유하기 전에는 읽거나 답하지 못합니다."
          tips:
            - "멘션이 없으면 토픽에 주 담당 에이전트가 지정된 경우 그 에이전트가 답합니다. 그렇지 않으면 라우팅 규칙이 일치하는 에이전트가 답할 수 있고, 둘 다 해당하지 않으면 메시지는 메모로 남습니다."
            - "@멘션은 참여자 한 명에게만 라우팅됩니다. 두 에이전트에게 같은 질문을 하려면 두 번 보내세요."
            - "에이전트가 Creative를 읽고 답하려면 댓글 권한이 필요합니다. Creative 자체를 변경하려면 쓰기 권한도 필요합니다."
        slash_command:
          title: "슬래시 명령어"
          tagline: "입력창에 /를 치면, 말하는 대신 실행할 수 있습니다."
          meta_description: "Collavre 슬래시 명령어: /calendar, /topic, /work, /compress, /creative 그리고 MCP 도구."
          sections:
            - heading: "사용 방법"
              body: "메시지 맨 앞에 /를 입력하면 사용 가능한 명령어 메뉴가 나타납니다. 인자가 필요한 명령어는 작은 폼을 열기 때문에 인자 순서를 외울 필요가 없으며, 메시지처럼 전송되어 실행 결과가 스레드에 남습니다. /creative는 다르게 동작합니다. Creative 선택 창을 열고 선택한 항목의 링크를 초안에 삽입하므로, 내용을 계속 작성한 뒤 사용자가 직접 메시지를 전송해야 합니다."
            - heading: "기본 제공 명령어"
              body: "/calendar(또는 /cal)는 날짜와 메모로 로컬 캘린더 일정을 만들며 tomorrow, +3days, +mon 같은 상대 날짜를 인식합니다. Google Calendar가 연결되어 있으면 Collavre가 해당 일정의 동기화도 시도합니다. /topic은 이름 붙은 토픽을 만들고 주 담당 에이전트를 지정할 수 있습니다. 같은 이름이 이미 있으면 새 토픽 대신 기존 토픽을 대상으로 합니다. 에이전트를 멘션하면 기존 토픽의 주 담당 에이전트를 지정하거나 교체하고, 멘션하지 않으면 지정되어 있던 주 담당 에이전트를 해제합니다. 주 담당 에이전트를 지정·교체·해제하려면 쓰기 권한이 필요합니다. /work는 하위 Creative를 깊이 우선으로 순회하며 에이전트가 대상 항목에 작업을 수행하게 하되, 이미 완료됐거나 활성 task가 있는 Creative는 건너뜁니다. /compress는 현재 토픽의 메시지를 요약하고 원본을 정리합니다. /creative는 다른 Creative 링크를 삽입하며, AI 채팅에서는 그 Creative와 에이전트에 설정된 하위 깊이 한도까지의 하위 항목이 컨텍스트로 함께 주입됩니다."
            - heading: "MCP 도구"
              body: "워크스페이스에 등록된 MCP 도구는 기본 명령어 아래 같은 메뉴에 나타나며 동일한 명령 폼으로 실행됩니다. 표시되는 도구는 등록 여부와 사용 권한에 따라 달라집니다."
          tips:
            - "입력 중이던 내용은 그대로 유지됩니다. 인자 폼이 있는 명령은 초안을 잠시 보관하고 명령만 따로 전송한 뒤, 전송 처리가 끝나면 초안을 복원합니다. 인자 폼이 없는 명령은 사용자가 수정하고 전송할 수 있도록 입력창에 남습니다."
            - "/compress에는 토픽, 쓰기 권한, 사용 가능한 AI 에이전트가 필요합니다. Collavre는 토픽의 주 담당 에이전트, 정책의 주 담당 에이전트, 해당 Creative에 댓글 권한으로 공유된 AI 에이전트 순으로 찾습니다."
            - "명령어는 메시지로 전송되므로 일반적으로 댓글 권한이 필요하고, 보관된 Creative에서는 사용할 수 없습니다. /topic으로 주 담당 에이전트를 지정·교체·해제하려면 추가로 쓰기 권한이 필요합니다."
        chat_context:
          title: "채팅 컨텍스트"
          tagline: "내용을 붙여넣는 대신, 에이전트가 볼 Creative를 가리키세요."
          meta_description: "다른 Creative를 컨텍스트로 연결해 Collavre 채팅의 AI 에이전트가 참고하게 하는 방법."
          sections:
            - heading: "사용 방법"
              body: "다른 Creative를 컨텍스트로 연결하면 이 채팅의 에이전트가 그 Creative의 설명과 하위 항목을 각 에이전트에 설정된 하위 깊이 한도까지 답변에 참고합니다. 연결은 살아 있어서, 원본 Creative를 수정하면 다음 메시지부터 에이전트가 보는 내용도 바뀝니다. 대화에 내용이 복사되지는 않습니다."
            - heading: "컨텍스트는 상속됩니다"
              body: "Creative는 상위 Creative에 연결된 컨텍스트를 물려받습니다. 팀의 작업 규칙을 트리 상단에 한 번만 연결해두면 그 아래 모든 채팅이 이미 그 규칙을 알고 있으므로, 같은 설명을 스레드마다 다시 붙여넣지 않아도 됩니다."
            - heading: "메시지 안에서 연결하기"
              body: "/creative 명령어는 메시지 자체에 다른 Creative 링크를 삽입합니다. AI 채팅에서는 그 Creative와 같은 설정 깊이까지의 하위 항목이 해당 대화의 컨텍스트로 주입되므로, 상시로 붙여두고 싶지 않은 일회성 참조에 적합합니다."
          tips:
            - "컨텍스트는 에이전트가 읽는 범위이지 변경할 수 있는 범위가 아닙니다. 쓰기 권한은 공유로 따로 정해집니다."
            - "각 에이전트에는 하위 깊이 한도가 설정됩니다. 기본값은 하위 6단계이며, 0이면 참조한 Creative만 포함됩니다. 그보다 깊은 하위 항목은 에이전트에게 전달되지 않습니다."
            - "질문에 답하기에 충분한 가장 좁은 Creative를 연결하세요. 큰 트리는 에이전트가 실제 요청에 쓸 주의력을 가져갑니다."
        automation_trigger:
          title: "자동화 트리거"
          tagline: "일이 도착하면 에이전트가 스스로 반응하게 하세요."
          meta_description: "Creative가 이동하거나 메시지가 도착할 때 AI 에이전트를 자동 실행하는 Collavre의 드롭 트리거와 트리거 루프."
          sections:
            - heading: "드롭 트리거"
              body: "Creative를 트리거 컨테이너로 지정하면 그 Creative는 하나의 공정 단계가 됩니다. 다른 Creative가 그 안으로 이동될 때마다, 컨테이너에 지정된 AI 에이전트가 그 단계의 목적에 맞게 새로 들어온 항목을 처리하도록 요청받습니다. 트리거 컨테이너를 여러 단계로 늘어놓으면, 누가 일일이 배정하지 않아도 트리가 파이프라인처럼 동작합니다."
            - heading: "트리거 루프"
              body: "루프 트리거는 작업이 끝날 때까지 이어가도록 설계되었습니다. 에이전트는 각 회차 끝에 DONE, CONTINUE, BLOCKED 중 하나를 보고합니다. CONTINUE면 다음 회차가 돌고, BLOCKED면 사용자를 기다리며 멈추고, 반복 횟수 상한이 있어 혼란에 빠진 에이전트가 무한히 돌지 않습니다. 에이전트가 사용자의 판단을 요청하면 루프는 대기하다가 토픽에 답을 남기는 순간 이어서 진행합니다."
            - heading: "먼저 필요한 것"
              body: "트리거에는 컨테이너에 쓰기 권한을 가진 AI 에이전트가 필요합니다. 없으면 이동은 기록되지만 아무것도 실행되지 않으며, 조용히 실패하는 대신 스레드에 그 사실을 남깁니다."
          tips:
            - "DONE 보고는 요청받은 작업을 기준으로 가능한 범위에서 검증됩니다. 검증기가 남은 작업을 찾으면 다음 회차로 되돌립니다. 검증 에이전트가 없거나, 검증 응답이 비어 있거나, 검증 요청이 실패하면 작업이 멈추지 않도록 DONE을 수락하고 루프를 완료합니다."
            - "컨테이너 설명의 핵심 지시는 처음 24자 안에 넣으세요. 트리거 메시지는 전체 설명이 아니라 화면에 보이는 텍스트의 24자 요약만 받습니다."
        topic_management:
          title: "토픽"
          tagline: "하나의 채팅을 서로 방해하지 않는 여러 대화로 나눕니다."
          meta_description: "하나의 Collavre 채팅 안에서 대화 갈래를 분리해 관리하는 토픽 사용법."
          sections:
            - heading: "사용 방법"
              body: "토픽은 Creative 채팅 안의 이름 붙은 스레드입니다. 토픽에서 보낸 메시지는 그 토픽에 남으므로, 오래 걸리는 조사와 짧은 질문이 서로 뒤섞이지 않고 한 Creative를 공유할 수 있습니다. 토픽 목록에서는 보관된 토픽까지 포함해 모든 토픽을 볼 수 있습니다."
            - heading: "토픽과 에이전트"
              body: "토픽에는 멘션 없는 메시지에 단독으로 답하는 주 담당 에이전트를 지정할 수 있습니다. 다른 에이전트의 라우팅 규칙이 일치해도 주 담당 에이전트가 답하지만, 다른 에이전트를 명시적으로 멘션하면 그 에이전트가 대신 답합니다. /topic \"이름\" @에이전트: 로 토픽 생성과 주 담당 에이전트 지정을 한 번에 처리합니다. 같은 이름의 토픽이 이미 있으면 기존 토픽의 주 담당 에이전트를 지정하거나 교체하며, 멘션 없이 /topic \"이름\"을 사용하면 기존 주 담당 에이전트를 해제합니다. 주 담당 에이전트를 새로 지정하거나 변경·해제하려면 쓰기 권한이 필요합니다. 이렇게 하면 하나의 Creative에서 여러 에이전트가 각자의 토픽에서 서로의 대화를 읽지 않고 동시에 일할 수 있습니다."
            - heading: "토픽을 가볍게 유지하기"
              body: "/compress는 토픽의 메시지를 요약하고 원본을 정리해 결론만 남깁니다. 오래 이어지는 토픽이 아무도 스크롤하지 않는 기록 더미가 되는 대신 계속 쓸모 있게 유지됩니다."
          tips:
            - "끝난 토픽은 보관하세요. 계속 읽을 수 있지만 활성 목록에서는 빠집니다."
            - "압축에는 쓰기 권한과 사용 가능한 AI 에이전트가 필요합니다. Collavre는 토픽의 주 담당 에이전트, 정책의 주 담당 에이전트, 해당 Creative에 댓글 권한으로 공유된 AI 에이전트 순으로 찾습니다."
        inbox_notifications:
          title: "인박스 알림"
          tagline: "확인이 필요한 업데이트가 System 토픽에 모입니다."
          meta_description: "Collavre 인박스의 System 토픽에 어떤 알림이 모이고 이 토픽이 어떻게 동작하는지 알아봅니다."
          sections:
            - heading: "이곳에 오는 알림"
              body: "멘션, 새 대화 활동, Creative 공유, 권한 요청, 관리 알림, 중요한 에이전트 복구 안내가 인박스의 System 토픽에 표시될 수 있습니다. 모든 Creative를 다시 열지 않아도 한 흐름에서 활동을 확인할 수 있습니다."
            - heading: "알림 전용 토픽"
              body: "System은 알림을 위해 예약되어 일반 토픽과 다르게 동작합니다. 이곳의 메시지에 에이전트 멘션이나 슬래시 명령어가 있어도 AI 에이전트를 실행하지 않습니다."
          tips:
            - "알림이 없는 것은 정상입니다. 지금 확인할 새 소식이 없다는 뜻입니다."
            - "인박스의 다른 토픽은 일반 대화 토픽처럼 동작합니다."
        inbox_reply:
          title: "인박스에서 바로 답장"
          tagline: "System 토픽을 떠나지 않고 대화 알림에 답합니다."
          meta_description: "Collavre 인박스에서 대화 알림에 답장하고 원래 토픽으로 응답을 전달하는 방법."
          sections:
            - heading: "동작 방식"
              body: "대화 알림 뒤에 메시지를 보내면 Collavre가 그 메시지를 원본 Creative의 같은 토픽에 원문 댓글의 답장으로 복사합니다. 보낸 메시지는 인박스에도 남아 전달 과정을 확인할 수 있습니다."
            - heading: "어떤 알림에 답장되는지"
              body: "바로 앞의 가장 최근 System 알림을 기준으로 전달합니다. 그 알림이 원문 댓글과 연결되어 있고 원본 Creative에 댓글 권한이 있을 때만 복사됩니다. 조건을 충족하지 않으면 메시지는 인박스에만 남습니다."
          tips:
            - "보내기 전에 초안 바로 위의 알림이 답장하려는 대상인지 확인하세요."
            - "첨부 파일도 답장과 함께 원래 대화로 복사됩니다."
        inbox_source:
          title: "원문으로 바로 이동"
          tagline: "알림이 발생한 대화로 이동해 전체 맥락을 확인합니다."
          meta_description: "Collavre 인박스 알림의 링크로 원본 Creative와 대화를 여는 방법."
          sections:
            - heading: "원래 맥락 열기"
              body: "원본 맥락을 제공할 수 있는 대화 알림에는 Creative 링크가 포함됩니다. 링크를 누르면 해당 Creative의 채팅이 열리므로 조치하기 전에 주변 메시지를 확인할 수 있습니다."
            - heading: "인박스를 허브로 사용하기"
              body: "System에서 알림을 훑고, 더 넓은 맥락이 필요할 때 원문을 연 다음, 다음 업데이트를 위해 인박스로 돌아오세요. 전체 대화를 복제하지 않고도 알림 흐름을 간결하게 유지할 수 있습니다."
          tips:
            - "원본이 삭제되었거나 접근 권한이 회수되면 열 수 없을 수 있습니다."
        add_user:
          title: "사용자 추가"
          tagline: "팀원이나 AI 에이전트를 이 Creative에 초대합니다."
          meta_description: "Collavre Creative를 팀원이나 AI 에이전트와 공유하고 권한을 조정하는 방법."
          sections:
            - heading: "사용 방법"
              body: "Creative를 공유하면 그 Creative와 하위 전체에 접근 권한이 부여됩니다. 그래서 Creative를 하나씩 공유하는 대신, 그 사람이 실제로 일하는 층위에서 공유하면 됩니다. Creative 소유자와 댓글 이상의 권한으로 공유된 사람은 채팅에서 멘션할 수 있습니다. 읽기 전용 참여자는 전역 검색이 허용된 경우에만 멘션할 수 있습니다."
            - heading: "권한 단계"
              body: "권한은 읽기, 댓글, 쓰기, 관리로 나뉩니다. 의견은 주되 구조는 바꾸지 않아야 할 검토자에게는 댓글 권한을, 요약만 하는 에이전트에게는 쓰기 권한 없이 부여하면 됩니다. 공유 대상을 변경할 수 있는 것은 해당 Creative의 관리 권한자뿐입니다."
            - heading: "AI 에이전트도 참여자입니다"
              body: "AI 에이전트는 사람과 같은 방식으로, 각자의 권한 단계와 함께 추가됩니다. 이것이 에이전트의 활동 범위를 검토 가능하게 만듭니다. 어떤 Creative를 읽을 수 있고 어떤 것을 변경할 수 있는지 그대로 확인하고, 언제든 회수할 수 있습니다."
          tips:
            - "맡은 일을 할 수 있는 가장 좁은 권한부터 주세요. 나중에 다시 공유하지 않고도 올릴 수 있습니다."
            - "대개 트리 상단에서 공유하는 편이 낫습니다. 상속된 권한이 개별 권한 수십 개보다 파악하기 쉽습니다."
