ko:
  collavre:
    inline_agent_login:
      required: 계속하려면 %{engine} 로그인이 필요합니다.
      help: 여기서 로그인하면 원래 요청을 다시 실행합니다.
      partial: 여기서 로그인한 뒤 새 메시지로 계속해 주세요. 이미 실행을 시작한 요청은 자동으로 반복하지 않습니다.
      owner_required: 공유 연결은 에이전트 소유자 또는 시스템 관리자가 로그인해야 합니다.
      requester_required: 이 요청을 시작한 사용자가 자신의 연결에 로그인해야 합니다.
      resumed: 로그인이 완료되어 원래 요청을 다시 실행하도록 예약했습니다.
      expired: 로그인이 만료되었습니다. 다시 시작해 주세요.
      errors:
        session_superseded: 다른 로그인으로 대체되었습니다. 다시 시작해 주세요.
        not_authorized: 로그인을 완료한 뒤 다시 시도해 주세요.
        cannot_retry: 아직 요청을 다시 실행할 수 없습니다. 새로고침 후 다시 시도해 주세요.
