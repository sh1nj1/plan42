      meta_skills: 활성 메타 스킬
      meta_skills_help: AI Agent 설정자가 선택한 Collavre 도구입니다. 단일 collavre-cli 스킬이 실행하며, 토큰 단위 권한 제어는 추후 추가됩니다.
      rotate_tokens: 콜백 토큰 회전
