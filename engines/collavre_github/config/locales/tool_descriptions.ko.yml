ko:
  collavre:
    tool_descriptions:
      github_pr_commits:
        summary: GitHub 풀 리퀘스트의 커밋 메시지를 가져옵니다.
        details: 크리에이티브에 GitHub 저장소가 연결되어 있어야 합니다.
      github_pr_details:
        summary: GitHub 풀 리퀘스트의 제목, 본문, 작성자, 변경 파일을 가져옵니다.
        details: 크리에이티브에 GitHub 저장소가 연결되어 있어야 합니다.
      github_pr_diff:
        summary: GitHub 풀 리퀘스트의 diff를 가져옵니다.
        details: 변경된 파일들의 패치를 합쳐 반환하며, max_length 글자(기본 10,000자)를 넘으면 잘리므로 큰 PR에서는 뒤쪽 파일이 빠질 수 있습니다. 크리에이티브에 GitHub 저장소가 연결되어 있어야 합니다.
      pr_monitor:
        summary: 토픽에서 GitHub 풀 리퀘스트를 모니터링합니다.
        details: PR 코멘트, 리뷰 코멘트, 리뷰가 토픽에 채팅 메시지로 게시됩니다. 같은 PR로 다시 호출해도 중복되지 않습니다.
      pr_state_set:
        summary: GitHub 업데이트를 놓쳤을 때 모니터링 중인 풀 리퀘스트의 상태를 바로잡습니다.
        details: |-
          상태를 지정하지 않으면 GitHub에서 다시 동기화하며, 이 방식을 권장합니다. 저장소에 연결된 GitHub 계정이 없을 때만 상태를 직접 지정하세요.
          머지 또는 닫힘으로 표시하면 종료 메시지를 게시하고 모니터링을 멈추며, 다시 열면 모니터링을 재개합니다.
