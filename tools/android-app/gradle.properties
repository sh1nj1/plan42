org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Build cache disabled: Hilt's ASM transform (transformDebugClassesWithAsm) can
# cache an output that drops the @HiltAndroidApp injector (VoiceApp_GeneratedInjector),
# producing an APK that crashes at startup with NoClassDefFoundError. clean does not
# evict the poisoned entry, so every rebuild re-served the broken artifact. Builds
# here take ~10s, so the cache isn't worth that risk.
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
