name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  test_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: npm audit --production

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # Production runs PostgreSQL while dev/test run SQLite, so db/schema.rb is
  # dumped from SQLite and can silently pick up SQLite-only constructs (e.g.
  # json_extract expression indexes) that crash `db:schema:load` on Postgres —
  # a failure that would only surface in production. This smoke job loads the
  # schema against a real Postgres to fail fast. Everything lives in the single
  # db/schema.rb (Solid Queue/Cache/Cable tables included, and all engine
  # tables), so loading that one file covers every engine's schema too.
  postgres_schema_load:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collavre
          POSTGRES_PASSWORD: collavre
          POSTGRES_DB: collavre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collavre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Load schema on PostgreSQL (fail on SQLite-only constructs)
        env:
          RAILS_ENV: test
          # postgresql:// scheme so config/database.yml derives the correct
          # "postgresql" adapter; the URL overrides the SQLite test database.
          DATABASE_URL: postgresql://collavre:collavre@localhost:5432/collavre_test
        run: bin/rails db:schema:load

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: redis
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config libvips libvips-dev google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build JavaScript assets
        run: npm run build

      - name: Run tests
        env:
          RAILS_ENV: test
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rake test && bundle exec rake test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
