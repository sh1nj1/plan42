name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  test_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npm run test:coverage

      - name: JavaScript coverage summary
        if: ${{ !cancelled() }}
        run: node bin/coverage_summary_js.mjs coverage/js/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JavaScript coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/js/lcov.info
          flags: javascript
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: npm audit --production

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      # script/lightsail_launch.sh provisions a host, so nothing else in CI can
      # exercise it. These are its pure helpers, run as plain bash.
      - name: Test shell script helpers
        run: bash script/test/lightsail_launch_test.sh

  # Entity-level complexity ratchet: RuboCop's Metrics department over Ruby app
  # code and ESLint's size and complexity rules over the core engine's
  # JavaScript, run twice — once on this branch, once on a detached checkout of
  # the merge base — and compared entity by entity. The two measurements take
  # about 8s together. See docs/complexity_budget.md.
  complexity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The merge base has to be a real commit in the local history, and
          # `git worktree add` has to be able to check it out.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # ESLint only. The merge-base worktree gets no install of its own — it is
      # measured with this checkout's ESLint and this branch's budget, which is
      # the same rule the Ruby half follows for .rubocop_metrics.yml.
      - name: Install dependencies
        run: npm ci

      # The budgets in .rubocop_metrics.yml and .eslint_metrics.yml may only
      # tighten. The `complexity-baseline-reset` label is the way past that, for the case it
      # was written for: a deliberate, reviewed budget change. Applying a label
      # does not re-trigger CI, so re-run this job afterwards.
      # The baseline is the base *branch*, not `pull_request.base.sha`. That
      # field is the base tip as of the last open/synchronize event on this PR
      # and does not move when the base branch does, while the checkout above
      # is `refs/pull/N/merge`, which GitHub recomputes against the current
      # base tip. Measuring the second against the first attributes every
      # sibling PR that landed in between to this one: PR #1651 saw eight such
      # reports, all of them other branches' code. Resolving the ref here makes
      # the baseline `merge-base(HEAD, base tip)`, which is the base tip
      # itself, so the diff measured is exactly this branch's.
      - name: Check the complexity ratchet
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ALLOW_BUDGET_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'complexity-baseline-reset') && '--allow-budget-change' || '' }}
        run: |
          git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          bin/complexity_check --base "origin/$BASE_REF" $ALLOW_BUDGET_CHANGE

  # Production runs PostgreSQL while dev/test run SQLite, so db/schema.rb is
  # dumped from SQLite and can silently pick up SQLite-only constructs (e.g.
  # json_extract expression indexes) that crash `db:schema:load` on Postgres —
  # a failure that would only surface in production. This smoke job loads the
  # schema against a real Postgres to fail fast. Everything lives in the single
  # db/schema.rb (Solid Queue/Cache/Cable tables included, and all engine
  # tables), so loading that one file covers every engine's schema too.
  postgres_schema_load:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collavre
          POSTGRES_PASSWORD: collavre
          POSTGRES_DB: collavre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collavre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ActiveStorage initializes its Vips transformer during Rails boot.
      - name: Install image processing runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Load schema on PostgreSQL (fail on SQLite-only constructs)
        env:
          RAILS_ENV: test
          # postgresql:// scheme so config/database.yml derives the correct
          # "postgresql" adapter; the URL overrides the SQLite test database.
          DATABASE_URL: postgresql://collavre:collavre@localhost:5432/collavre_test
        run: bin/rails db:schema:load

      # Loading the schema only proves the DDL is portable. Query text diverges
      # too: SQLite compares `json` columns, Postgres has no equality operator
      # for `json`, so `SELECT DISTINCT users.*` passes the whole SQLite suite
      # and raises PG::UndefinedFunction in the deployed environment. This runs
      # the request-path queries that hit those tables for real.
      - name: Smoke request-path queries on PostgreSQL
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://collavre:collavre@localhost:5432/collavre_test
        run: bin/rails runner script/postgres_query_smoke.rb

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: redis
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config libvips libvips-dev google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build JavaScript assets
        run: npm run build

      - name: Run tests
        env:
          RAILS_ENV: test
          # COVERAGE activates the SimpleCov bootstrap (test/support/coverage.rb),
          # which is a no-op otherwise. Both `rake test` and `rake test:system`
          # run in separate processes and merge into one report via merge_timeout.
          COVERAGE: "1"
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rake test && bundle exec rake test:system

      - name: Ruby coverage summary
        if: ${{ !cancelled() }}
        run: ruby bin/coverage_summary coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ruby coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: ruby
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
