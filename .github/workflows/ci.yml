name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  test_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npm run test:coverage

      - name: JavaScript coverage summary
        if: ${{ !cancelled() }}
        run: node bin/coverage_summary_js.mjs coverage/js/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JavaScript coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/js/lcov.info
          flags: javascript
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: npm audit --production

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      # script/lightsail_launch.sh provisions a host, so nothing else in CI can
      # exercise it. These are its pure helpers, run as plain bash.
      - name: Test shell script helpers
        run: bash script/test/lightsail_launch_test.sh

  # Entity-level complexity ratchet. Adds ~2s: RuboCop's Metrics department over
  # app code only, compared against .complexity_baseline.yml. See
  # docs/complexity_budget.md.
  complexity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # --verify-baseline diffs this branch's baseline against the base
          # branch, so the base commit has to be in the local history.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Runs first: if the baseline was loosened, the check below would happily
      # pass and the loosening is the actual finding.
      #
      # The `complexity-baseline-reset` label is the only way past this, and it
      # exists for one case: a RuboCop upgrade that changes how a metric is
      # computed, which shifts every value at once. Applying a label does not
      # re-trigger CI, so re-run this job afterwards.
      - name: Verify the complexity baseline was not loosened
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'complexity-baseline-reset')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bin/complexity_check --verify-baseline "$BASE_SHA"

      - name: Check the complexity ratchet
        run: bin/complexity_check

  # Production runs PostgreSQL while dev/test run SQLite, so db/schema.rb is
  # dumped from SQLite and can silently pick up SQLite-only constructs (e.g.
  # json_extract expression indexes) that crash `db:schema:load` on Postgres —
  # a failure that would only surface in production. This smoke job loads the
  # schema against a real Postgres to fail fast. Everything lives in the single
  # db/schema.rb (Solid Queue/Cache/Cable tables included, and all engine
  # tables), so loading that one file covers every engine's schema too.
  postgres_schema_load:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collavre
          POSTGRES_PASSWORD: collavre
          POSTGRES_DB: collavre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collavre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Load schema on PostgreSQL (fail on SQLite-only constructs)
        env:
          RAILS_ENV: test
          # postgresql:// scheme so config/database.yml derives the correct
          # "postgresql" adapter; the URL overrides the SQLite test database.
          DATABASE_URL: postgresql://collavre:collavre@localhost:5432/collavre_test
        run: bin/rails db:schema:load

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: redis
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config libvips libvips-dev google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build JavaScript assets
        run: npm run build

      - name: Run tests
        env:
          RAILS_ENV: test
          # COVERAGE activates the SimpleCov bootstrap (test/support/coverage.rb),
          # which is a no-op otherwise. Both `rake test` and `rake test:system`
          # run in separate processes and merge into one report via merge_timeout.
          COVERAGE: "1"
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rake test && bundle exec rake test:system

      - name: Ruby coverage summary
        if: ${{ !cancelled() }}
        run: ruby bin/coverage_summary coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ruby coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: ruby
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
