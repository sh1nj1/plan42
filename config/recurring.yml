production: &production
  stuck_detector:
    class: Collavre::StuckDetectorJob
    queue: default
    schedule: every 10 minutes
  comment_push_delivery_sweep:
    class: Collavre::CommentPushDeliverySweepJob
    queue: default
    schedule: every minute
  restore_dropped_dispatches:
    class: Collavre::RestoreDroppedDispatchesJob
    queue: default
    schedule: every 10 minutes
  github_webhook_delivery_prune:
    class: CollavreGithub::WebhookDeliveryPruneJob
    queue: default
    schedule: at 4am every day

desktop:
  stuck_detector:
    class: Collavre::StuckDetectorJob
    queue: default
    schedule: every 10 minutes
  comment_push_delivery_sweep:
    class: Collavre::CommentPushDeliverySweepJob
    queue: default
