production: &production
  daily_inbox_summary:
    class: InboxSummaryJob
    queue: default
    schedule: at 9am every day
  stuck_detector:
    class: Collavre::StuckDetectorJob
    queue: default
    schedule: every 10 minutes
  comment_push_delivery_sweep:
    class: Collavre::CommentPushDeliverySweepJob
    queue: default
    schedule: every minute
  restore_dropped_dispatches:
    class: Collavre::RestoreDroppedDispatchesJob
    queue: default
    schedule: every 10 minutes
  github_webhook_delivery_prune:
    class: CollavreGithub::WebhookDeliveryPruneJob
    queue: default
    schedule: at 4am every day

# Desktop runs non-mail jobs only: it has no SMTP/SES, so daily_inbox_summary's
# deliver_now would fail every run and the in-Puma Solid Queue supervisor would retry forever.
desktop:
  stuck_detector:
    class: Collavre::StuckDetectorJob
    queue: default
    schedule: every 10 minutes
  comment_push_delivery_sweep:
    class: Collavre::CommentPushDeliverySweepJob
    queue: default
    schedule: every minute
  restore_dropped_dispatches:
    class: Collavre::RestoreDroppedDispatchesJob
    queue: default
    schedule: every 10 minutes
  github_webhook_delivery_prune:
    class: CollavreGithub::WebhookDeliveryPruneJob
    queue: default
    schedule: at 4am every day

development:
  daily_inbox_summary:
    class: InboxSummaryJob
    queue: default
    schedule: every minute
  stuck_detector:
    class: Collavre::StuckDetectorJob
    queue: default
    schedule: every 5 minutes
  comment_push_delivery_sweep:
    class: Collavre::CommentPushDeliverySweepJob
    queue: default
    schedule: every minute
  restore_dropped_dispatches:
    class: Collavre::RestoreDroppedDispatchesJob
    queue: default
    schedule: every 10 minutes
  github_webhook_delivery_prune:
    class: CollavreGithub::WebhookDeliveryPruneJob
    queue: default
    schedule: at 4am every day
