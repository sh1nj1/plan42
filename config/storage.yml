test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

<%
  # `AwsCredentials.s3` returns a source-coherent pair (both DB, both ENV, or
  # neither), so a partial admin save can't combine a DB access_key_id with an
  # ENV secret and boot Active Storage with a mismatched credential pair.
  # When `Collavre::AwsCredentials` is unavailable (`USE_COLLAVRE_GEM=true`
  # with a gem version predating this feature), fall back to plain ENV so
  # legacy env-based S3 deploys keep working.
  s3_credentials =
    if defined?(Collavre::AwsCredentials)
      Collavre::AwsCredentials.s3
    elsif ENV["AWS_S3_ACCESS_KEY_ID"].present? && ENV["AWS_S3_SECRET_ACCESS_KEY"].present?
      { access_key_id: ENV["AWS_S3_ACCESS_KEY_ID"], secret_access_key: ENV["AWS_S3_SECRET_ACCESS_KEY"] }
    else
      {}
    end

  s3_region =
    if defined?(Collavre::IntegrationSettings)
      Collavre::IntegrationSettings.fetch(:aws_region, default: ENV.fetch("AWS_REGION", "ap-northeast-2"))
    else
      ENV.fetch("AWS_REGION", "ap-northeast-2")
    end

  s3_bucket =
    if defined?(Collavre::IntegrationSettings)
      Collavre::IntegrationSettings.fetch(:aws_s3_bucket, default: ENV.fetch("AWS_S3_BUCKET", "collavre-uploads-#{Rails.env}"))
    else
      ENV.fetch("AWS_S3_BUCKET", "collavre-uploads-#{Rails.env}")
    end
%>
amazon:
  service: S3
  access_key_id: <%= s3_credentials[:access_key_id] %>
  secret_access_key: <%= s3_credentials[:secret_access_key] %>
  region: <%= s3_region %>
  bucket: <%= s3_bucket %>
  upload:
    server_side_encryption: "AES256"

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
