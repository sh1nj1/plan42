test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  # `default: ENV[...]` keeps env-based deploys working for `USE_COLLAVRE_GEM=true`
  # builds where the gem-pinned version may not have the AWS keys registered
  # (fetch otherwise returns nil for unknown keys, ignoring ENV).
  access_key_id: <%= Collavre::IntegrationSettings.fetch(:aws_s3_access_key_id, default: ENV["AWS_S3_ACCESS_KEY_ID"]) %>
  secret_access_key: <%= Collavre::IntegrationSettings.fetch(:aws_s3_secret_access_key, default: ENV["AWS_S3_SECRET_ACCESS_KEY"]) %>
  region: <%= Collavre::IntegrationSettings.fetch(:aws_region, default: ENV.fetch("AWS_REGION", "ap-northeast-2")) %>
  bucket: <%= Collavre::IntegrationSettings.fetch(:aws_s3_bucket, default: ENV.fetch("AWS_S3_BUCKET", "collavre-uploads-#{Rails.env}")) %>
  upload:
    server_side_encryption: "AES256"

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

