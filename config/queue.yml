default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # High-priority worker for authorization cache (runs permission updates fast)
    - queues: [authz]
      threads: 2
      processes: 1
      polling_interval: <%= ENV.fetch("AUTHZ_POLLING_INTERVAL", 0.1) %>
    # Default worker for all other queues (excludes authz for strict priority,
    # and linear_inbound which gets its own sequential worker below)
    - queues: [default, mailers, active_storage_analysis, active_storage_purge]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Dedicated worker for AI agent turns (AiAgentJob). A turn streams from
    # the LLM for minutes, so these must not share threads with short jobs
    # (broadcasts, mailers, notifications) on the default worker. Thread
    # count sets execution capacity; the orchestrator's max_concurrent_jobs
    # (admin-configurable, code default 5) gates admission—set both together.
    # Threads block on provider I/O (GVL released), so they are cheap; each
    # does hold one DB connection for its whole turn — see the pool sizing
    # in config/database.yml.
    - queues: [ai_agents]
      threads: <%= ENV.fetch("AI_AGENT_THREADS", 12) %>
      processes: 1
      polling_interval: 0.1
    # Sequential worker for inbound Linear webhooks. A single thread + single
    # process makes this queue a strict FIFO consumer so events apply in receipt
    # order (a comment can arrive before its issue's create). Do NOT raise
    # threads/processes here — concurrency would reintroduce out-of-order applies.
    - queues: [linear_inbound]
      threads: 1
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

# Desktop app runs the same in-process Solid Queue workers as production.
desktop:
  <<: *default
