# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
<%
  # Adapter selection (development/test):
  #   1. DATABASE_URL set        -> use its scheme (postgres cutover, CI, etc.)
  #   2. DB_ADAPTER=postgresql   -> local Postgres, no URL required
  #   3. otherwise               -> sqlite3 (zero-config default)
  database_url = ENV["DATABASE_URL"].to_s
  raw_adapter  = database_url.empty? ? ENV.fetch("DB_ADAPTER", "sqlite3") : URI.parse(database_url).scheme
  # Normalize the "postgres" URL scheme to Rails' registered "postgresql" adapter name.
  adapter      = raw_adapter == "postgres" ? "postgresql" : raw_adapter
%>
default: &default
  adapter: <%= adapter %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  <% if adapter == "sqlite3" %>
  variables:
    journal_mode: WAL
    synchronous: normal
  <% elsif database_url.empty? %>
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "collavre_user") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  <% end %>

development:
  <<: *default
  <% if adapter == "sqlite3" %>
  database: storage/development.sqlite3
  <% elsif database_url.empty? %>
  database: <%= ENV.fetch("DATABASE_NAME", "collavre_db") %>
  <% else %>
  url: <%= database_url %>
  <% end %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  <% if adapter == "sqlite3" %>
  database: storage/test.sqlite3
  <% elsif database_url.empty? %>
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "collavre_test") %>
  <% else %>
  url: <%= database_url %>
  <% end %>

production:
  primary:
    <<: *default
    <% if adapter == "sqlite3" %>
    database: storage/production-primary.sqlite3
    <% else %>
    url: <%= ENV['DATABASE_URL'] %>
    encoding: unicode
    <% end %>
  cache:
    <<: *default
    <% if adapter == "sqlite3" %>
    database: storage/production-cache.sqlite3
    <% else %>
    url: <%= ENV['CACHE_DATABASE_URL'] || ENV['DATABASE_URL'] %>
    encoding: unicode
    <% end %>
  queue:
    <<: *default
    <% if adapter == "sqlite3" %>
    database: storage/production-queue.sqlite3
    <% else %>
    url: <%= ENV['QUEUE_DATABASE_URL'] || ENV['DATABASE_URL'] %>
    encoding: unicode
    <% end %>
  cable:
    <<: *default
    <% if adapter == "sqlite3" %>
    database: storage/production-cable.sqlite3
    <% else %>
    url: <%= ENV['CABLE_DATABASE_URL'] || ENV['DATABASE_URL'] %>
    encoding: unicode
    <% end %>

# Desktop app: same multi-database SQLite layout as production, but the four
# SQLite files live under a relocatable data directory (COLLAVRE_DATA_DIR) so
# the read-only .app bundle never holds mutable state. Always SQLite — the
# desktop env never receives a DATABASE_URL. See config/environments/desktop.rb.
<% desktop_data_dir = ENV.fetch("COLLAVRE_DATA_DIR") { Rails.root.join("storage").to_s } %>
desktop:
  primary:
    <<: *default
    adapter: sqlite3
    database: <%= File.join(desktop_data_dir, "desktop-primary.sqlite3") %>
  cache:
    <<: *default
    adapter: sqlite3
    database: <%= File.join(desktop_data_dir, "desktop-cache.sqlite3") %>
  queue:
    <<: *default
    adapter: sqlite3
    database: <%= File.join(desktop_data_dir, "desktop-queue.sqlite3") %>
  cable:
    <<: *default
    adapter: sqlite3
    database: <%= File.join(desktop_data_dir, "desktop-cable.sqlite3") %>
